# Tailscale sidecar - an optional overlay, not part of the base stack.
#
#   docker compose -f compose.yaml -f compose.tailscale.yaml up -d
#
# Or, to make it the default for this checkout, put this in .env:
#
#   COMPOSE_FILE=compose.yaml:compose.tailscale.yaml
#
# Deliberately a second file rather than another service in compose.yaml.
# TS_AUTHKEY below uses the `:?` form so a missing key fails loudly, which
# is right - but Compose interpolates the whole file before it works out
# which services to start, so that same `:?` sitting in compose.yaml would
# refuse to start Sportio itself on any machine with no Tailscale key. In
# its own file the hard failure fires only when Tailscale is what was
# asked for, which is the behaviour `:?` exists to give.

services:
  ts-sportio:
    image: tailscale/tailscale:latest
    container_name: ts-sportio
    # The tailnet device name: the app lands on
    # https://sportio.<your-tailnet>.ts.net once this comes up.
    hostname: sportio
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?TS_AUTHKEY is not set - add it to .env, or start without this overlay file}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      # These tags must already exist in the tailnet ACL, and the auth key
      # must be authorized to apply them, or the container will come up
      # and then fail to register.
      - TS_EXTRA_ARGS=--advertise-tags=tag:container,tag:shared
    volumes:
      # Named volume, so the node keeps its identity across recreates.
      # On a bind mount this is the thing that, if lost, makes every
      # restart register a brand new machine in the tailnet.
      - ts-state:/var/lib/tailscale
      # Read-only - tailscaled only ever reads this file.
      - ./serve.json:/config/serve.json:ro
    depends_on:
      - sportio-live
    restart: unless-stopped
    # No cap_add: NET_ADMIN and no /dev/net/tun here on purpose. Those are
    # needed to run a subnet router or an exit node; this container only
    # proxies to another container, which tailscaled does in userspace
    # mode - what the image already defaults to when there is no tun
    # device. Adding them would hand the container network privileges the
    # job does not call for.

volumes:
  ts-state:
